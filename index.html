    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.STATE);
        const seed = getSeedState();
        if (!raw) {
          localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(seed));
          return seed;
        }
        const parsed = JSON.parse(raw);
        return {
          ...seed,
          ...parsed,
          branding: { ...seed.branding, ...(parsed.branding || {}) },
          customColumns: {
            invoiceItems: Array.isArray(parsed.customColumns?.invoiceItems)
              ? parsed.customColumns.invoiceItems
              : seed.customColumns.invoiceItems,
            customers: Array.isArray(parsed.customColumns?.customers)
              ? parsed.customColumns.customers
              : seed.customColumns.customers,
            vendors: Array.isArray(parsed.customColumns?.vendors)
              ? parsed.customColumns.vendors
              : seed.customColumns.vendors
          },
          company: { ...seed.company, ...(parsed.company || {}) },
          invoices: Array.isArray(parsed.invoices) ? parsed.invoices : seed.invoices,
          customers: Array.isArray(parsed.customers) ? parsed.customers : seed.customers,
          vendors: Array.isArray(parsed.vendors) ? parsed.vendors : seed.vendors,
          expenses: Array.isArray(parsed.expenses) ? parsed.expenses : seed.expenses,
          auditLogs: Array.isArray(parsed.auditLogs) ? parsed.auditLogs : seed.auditLogs
        };
      } catch (err) {
        console.error('State load error:', err);
        return getSeedState();
      }
    }

    function saveStateOnly(stateObj) {
      try {
        localStorage.setItem(STORAGE_KEYS.STATE, JSON.stringify(stateObj));
      } catch (err) {
        console.error('State save error:', err);
      }
    }

    function loadSession() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEYS.SESSION);
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        return null;
      }
    }

    function saveSession(sessObj) {
      try {
        if (!sessObj) {
          sessionStorage.removeItem(STORAGE_KEYS.SESSION);
        } else {
          sessionStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(sessObj));
        }
      } catch (err) {
        console.error('Session save error:', err);
      }
    }

    function pushAuditLog(action, details) {
      const nowIso = new Date().toISOString().replace('T', ' ').slice(0, 19);
      const entry = {
        id: 'aud-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        timestamp: nowIso,
        actor: session?.name || 'Guest',
        role: session?.role || 'none',
        action,
        details
      };
      appState.auditLogs = [entry, ...(appState.auditLogs || [])].slice(0, 200);
    }

    async function dispatchWebhookSync(action, details) {
      const url = (appState.company?.syncWebhookUrl || '').trim();
      if (!url || !/^https?:\/\//i.test(url)) return;
      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            company: appState.company?.name,
            action,
            details,
            syncedAt: new Date().toISOString(),
            snapshot: {
              invoicesCount: appState.invoices.length,
              customersCount: appState.customers.length,
              vendorsCount: appState.vendors.length,
              expensesCount: appState.expenses.length
            }
          })
        });
        appState.company.lastSyncAt = new Date().toISOString().replace('T', ' ').slice(0, 19);
        saveStateOnly(appState);
      } catch (err) {
        console.warn('Webhook sync skipped/failed:', err);
      }
    }

    function commitState(action, details) {
      pushAuditLog(action, details);
      saveStateOnly(appState);
      dispatchWebhookSync(action, details);
    }

      }).format(n);
    }

    function computeInvoiceTotals(items = [], taxMode = 'INTRA', gstRate = 18) {
      let grossSubtotal = 0;
      let totalDiscount = 0;
      (items || []).forEach((it) => {
        const qty = Number(it.qty) || 0;
        const rate = Number(it.rate) || 0;
        const disc = Number(it.discount) || 0;
        const lineGross = qty * rate;
        const lineDisc = (lineGross * disc) / 100;
        grossSubtotal += lineGross;
        totalDiscount += lineDisc;
      });
      const taxableAmount = Math.max(0, grossSubtotal - totalDiscount);
      const rateNum = Number(gstRate) || 0;
      const totalGst = (taxableAmount * rateNum) / 100;
      const cgst = taxMode === 'INTRA' ? totalGst / 2 : 0;
      const sgst = taxMode === 'INTRA' ? totalGst / 2 : 0;
      const igst = taxMode === 'INTER' ? totalGst : 0;
      const grandTotal = taxableAmount + totalGst;
      return {
        grossSubtotal,
        totalDiscount,
        taxableAmount,
        cgst,
        sgst,
        igst,
        totalGst,
        grandTotal
      };
    }

    function getNextInvoiceNumber() {
      const prefix = appState.company?.invoicePrefix || 'AUR-2026-';
      let maxNum = 0;
      (appState.invoices || []).forEach((inv) => {
        if (inv.invoiceNumber && inv.invoiceNumber.startsWith(prefix)) {
          const parsed = parseInt(inv.invoiceNumber.slice(prefix.length), 10);
          if (!isNaN(parsed) && parsed > maxNum) {
            maxNum = parsed;
          }
        }
      });
      return `${prefix}${String(maxNum + 1).padStart(3, '0')}`;
    }

    function createBlankDraftInvoice() {
      const today = new Date().toISOString().split('T')[0];
      const due = new Date(Date.now() + 15 * 86400000).toISOString().split('T')[0];
      const customFields = {};
      (appState.customColumns?.invoiceItems || []).forEach((col) => {

      return {

        customerEmail: '',
        customerGstin: '',

        items: [

            rate: 0,
            discount: 0,
            customFields: { ...customFields }
          }
        ],
        notes: 'Thank you for choosing Aurenza Academy Private Limited.'
      };
    }

    function computeMetrics() {
      let totalBilled = 0;
      let totalCollected = 0;
      let totalOutstanding = 0;
      let paidCount = 0;
      let partialCount = 0;
      let pendingCount = 0;
      let overdueCount = 0;

      (appState.invoices || []).forEach((inv) => {
        const { grandTotal } = computeInvoiceTotals(inv.items, inv.taxMode, inv.gstRate);
        totalBilled += grandTotal;
        if (inv.status === 'Paid') {
          totalCollected += grandTotal;
          paidCount += 1;
        } else if (inv.status === 'Partial') {
          totalCollected += grandTotal * 0.5;
          totalOutstanding += grandTotal * 0.5;
          partialCount += 1;
        } else if (inv.status === 'Overdue') {
          totalOutstanding += grandTotal;
          overdueCount += 1;
        } else {
          totalOutstanding += grandTotal;
          pendingCount += 1;
        }
      });

      const totalExpenses = (appState.expenses || []).reduce(
        (acc, e) => acc + (Number(e.amount) || 0),
        0
      );
      const totalGstInput = (appState.expenses || []).reduce(
        (acc, e) => acc + (Number(e.gstInput) || 0),
        0
      );
      const netProfit = totalBilled - totalExpenses;

      return {
        totalBilled,
        totalCollected,
        totalOutstanding,
        totalExpenses,
        totalGstInput,
        netProfit,
        paidCount,
        partialCount,
        pendingCount,
        overdueCount
      };
    }

    function buildWhatsAppShareUrl(inv) {
      const t = computeInvoiceTotals(inv.items, inv.taxMode, inv.gstRate);
      const cleanPhone = String(inv.customerPhone || '').replace(/\D/g, '');
      const taxLines =
        inv.taxMode === 'INTRA'
          ? `CGST (${Number(inv.gstRate) / 2}%): ${formatINR(t.cgst)}\nSGST (${Number(inv.gstRate) / 2}%): ${formatINR(t.sgst)}`
          : `IGST (${Number(inv.gstRate)}%): ${formatINR(t.igst)}`;

      const text =
        `*${appState.company?.name || 'AURENZA ACADEMY PRIVATE LIMITED'}*\n` +
        `-----------------------------------\n` +
        `Dear *${inv.customerName || 'Valued Client'}*,\n` +
        `Please find your GST invoice summary below:\n\n` +
        `*Invoice No:* ${inv.invoiceNumber}\n` +
        `*Invoice Date:* ${inv.date}\n` +
        `*Due Date:* ${inv.dueDate}\n` +
        `*Taxable Value:* ${formatINR(t.taxableAmount)}\n` +
        `${taxLines}\n` +
        `*Grand Total:* *${formatINR(t.grandTotal)}*\n` +
        `*Status:* ${inv.status}\n\n` +
        `_Attach the downloaded/printed A4 PDF invoice before sending._\n` +
        `UPI ID: ${appState.company?.upiId || 'aurenzaacademy@hdfcbank'}`;

      const encoded = encodeURIComponent(text);
      return cleanPhone ? `https://wa.me/${cleanPhone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function getVercelJsonSnippet() {
      return JSON.stringify(
        {
          version: 2,
          name: appState.company?.vercelProjectName || 'aurenza-academy-erp',
          headers: [
            {
              source: '/(.*)',
              headers: [
                { key: 'X-Content-Type-Options', value: 'nosniff' },
                { key: 'X-Frame-Options', value: 'SAMEORIGIN' },
                { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' }
              ]
            }
          ],
          rewrites: [
            { source: '/(.*)', destination: '/index.html' }
          ]
        },
        null,
        2
      );
    }

    // ========================================================================
    // 7. MASTER RENDER & EVENT BINDING
    // ========================================================================
    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!session) {
        root.innerHTML = renderLoginScreen();
        bindLoginEvents();
        return;
      }

      let tabHtml = '';
      switch (ui.activeTab) {
        case 'invoices':
          tabHtml = renderInvoicesTab();
          break;
        case 'customers':
          tabHtml = renderCustomersTab();
          break;
        case 'vendors':
          tabHtml = renderVendorsTab();
          break;
        case 'expenses':
          tabHtml = renderExpensesTab();
          break;
        case 'vercel':
          tabHtml = renderVercelTab();
          break;
        case 'settings':
          tabHtml = renderSettingsTab();
          break;
        case 'audit':
          tabHtml = renderAuditTab();
          break;
        case 'dashboard':
        default:
          tabHtml = renderDashboardTab();
          break;
      }

      const modalsHtml = `
        ${ui.logoEditorModalOpen ? renderLogoEditorModal() : ''}
        ${ui.invoiceModalOpen ? renderInvoiceEditorModal() : ''}
        ${ui.previewInvoiceId ? renderInvoicePreviewModal() : ''}
        ${ui.customerModalOpen ? renderCustomerModal() : ''}
        ${ui.vendorModalOpen ? renderVendorModal() : ''}
        ${ui.expenseModalOpen ? renderExpenseModal() : ''}
        ${ui.deployGuideModalOpen ? renderDeployGuideModal() : ''}
      `;

      root.innerHTML = `
        <div id="toast-container"></div>
        <div class="min-h-screen bg-[#F9F9FB] text-[#1E2538] flex flex-col lg:flex-row">
          <header class="lg:hidden bg-white border-b border-[#E5E7EB] px-4 py-3 flex items-center justify-between sticky top-0 z-30 no-print">
            ${renderAurenzaLogoSVG('w-40', true)}
            <button type="button" id="mobile-menu-toggle" class="px-3 py-1.5 rounded-lg border border-[#E5E7EB] text-xs font-bold cursor-pointer">
              ${ui.mobileMenuOpen ? 'Close' : 'Menu'}
            </button>
          </header>

          ${renderSidebar()}

          <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full no-print">
            ${renderTopBar()}
            ${tabHtml}
          </main>
        </div>
        ${modalsHtml}
      `;

      bindWorkspaceEvents();
      renderToastOnly();
    }

    function bindLoginEvents() {
      const adminTab = document.getElementById('role-tab-admin');
      const empTab = document.getElementById('role-tab-employee');
      const guideBtn = document.getElementById('login-open-guide');
      const form = document.getElementById('login-form');

      if (adminTab) {
        adminTab.addEventListener('click', () => {
          ui.authRoleTab = 'admin';
          ui.authError = '';
          render();
        });
      }
      if (empTab) {
        empTab.addEventListener('click', () => {
          ui.authRoleTab = 'employee';
          ui.authError = '';
          render();
        });
      }
      if (guideBtn) {
        guideBtn.addEventListener('click', () => {
          session = { name: 'Preview Guest', role: 'employee' };
          ui.activeTab = 'vercel';
          render();
        });
      }
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const nameVal = (document.getElementById('login-name')?.value || '').trim();
          const pinVal = (document.getElementById('login-pin')?.value || '').trim();
          const expectedAdmin = appState.company?.adminCodeHint || 'ADMIN2026';
          const expectedEmp = appState.company?.employeeCodeHint || 'STAFF2026';

          if (ui.authRoleTab === 'admin') {
            if (pinVal !== expectedAdmin) {
              ui.authError = 'Invalid Admin PIN.';
              render();
              return;
            }
            session = { name: nameVal || 'Admin', role: 'admin' };
          } else {
            if (pinVal !== expectedEmp && pinVal !== expectedAdmin) {
              ui.authError = 'Invalid Employee PIN.';
              render();
              return;
            }
            session = { name: nameVal || 'Employee', role: 'employee' };
          }
          saveSession(session);
          ui.authError = '';
          commitState('LOGIN_SUCCESS', `Signed in as ${session.name} (${session.role}).`);
          showToast(`Signed in as ${session.role.toUpperCase()}`);
          render();
        });
      }
    }

    function syncDraftFromDOM() {
      if (!ui.draftInvoice) return;
      const fields = [
        ['inv-number', 'invoiceNumber', 'str'],
        ['inv-date', 'date', 'str'],
        ['inv-due', 'dueDate', 'str'],
        ['inv-cust-name', 'customerName', 'str'],
        ['inv-cust-company', 'customerCompany', 'str'],
        ['inv-cust-phone', 'customerPhone', 'str'],
        ['inv-cust-gstin', 'customerGstin', 'str'],
        ['inv-cust-address', 'customerAddress', 'str'],
        ['inv-tax-mode', 'taxMode', 'str'],
        ['inv-gst-rate', 'gstRate', 'num'],
        ['inv-status', 'status', 'str'],
        ['inv-pay-mode', 'paymentMode', 'str'],
        ['inv-notes', 'notes', 'str']
      ];
      fields.forEach(([elId, key, kind]) => {
        const el = document.getElementById(elId);
        if (!el) return;
        ui.draftInvoice[key] = kind === 'num' ? Number(el.value) || 0 : el.value.trim();
      });

      document.querySelectorAll('.item-input').forEach((inp) => {
        const idx = Number(inp.getAttribute('data-item-idx'));
        const prop = inp.getAttribute('data-field');
        if (!ui.draftInvoice.items[idx]) return;
        if (prop === 'qty' || prop === 'rate' || prop === 'discount') {
          ui.draftInvoice.items[idx][prop] = Number(inp.value) || 0;
        } else {
          ui.draftInvoice.items[idx][prop] = inp.value;
        }
      });

      document.querySelectorAll('.item-custom-input').forEach((inp) => {
        const idx = Number(inp.getAttribute('data-item-idx'));
        const colId = inp.getAttribute('data-custom-col-id');
        if (!ui.draftInvoice.items[idx]) return;
        ui.draftInvoice.items[idx].customFields = {
          ...(ui.draftInvoice.items[idx].customFields || {}),
          [colId]: inp.value
        };
      });
    }

    function bindWorkspaceEvents() {
      // Modal close buttons
      document.querySelectorAll('.close-modal-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const kind = btn.getAttribute('data-close-modal');
          if (kind === 'logo') ui.logoEditorModalOpen = false;
          if (kind === 'invoice') {
            ui.invoiceModalOpen = false;
            ui.editingInvoiceId = null;
            ui.draftInvoice = null;
          }
          if (kind === 'preview') ui.previewInvoiceId = null;
          if (kind === 'customer') {
            ui.customerModalOpen = false;
            ui.editingCustomerId = null;
          }
          if (kind === 'vendor') {
            ui.vendorModalOpen = false;
            ui.editingVendorId = null;
          }
          if (kind === 'expense') {
            ui.expenseModalOpen = false;
            ui.editingExpenseId = null;
          }
          if (kind === 'guide') ui.deployGuideModalOpen = false;
          render();
        });
      });

      // Mobile menu & nav
      const mobileBtn = document.getElementById('mobile-menu-toggle');
      if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
          ui.mobileMenuOpen = !ui.mobileMenuOpen;
          render();
        });
      }

      document.querySelectorAll('.nav-item-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.activeTab = btn.getAttribute('data-nav');
          ui.mobileMenuOpen = false;
          render();
        });
      });

      // Logout & JSON export
      const logoutBtn = document.getElementById('sidebar-logout');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          commitState('LOGOUT', `Signed out ${session.name}.`);
          session = null;
          saveSession(null);
          render();
        });
      }

      const exportJsonFn = () => {
        downloadFile(
          `aurenza-backup-${new Date().toISOString().split('T')[0]}.json`,
          JSON.stringify(appState, null, 2),
          'application/json'
        );
        showToast('Exported JSON backup.');
      };
      const topExportJson = document.getElementById('topbar-export-json');
      if (topExportJson) topExportJson.addEventListener('click', exportJsonFn);

      // Open Logo Editor
      ['sidebar-edit-logo', 'topbar-edit-logo', 'settings-open-logo-editor'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('click', () => {
            ui.logoEditorModalOpen = true;
            ui.mobileMenuOpen = false;
            render();
          });
        }
      });

      // Open New Invoice
      const openNewInvoice = () => {
        ui.editingInvoiceId = null;
        ui.draftInvoice = createBlankDraftInvoice();
        ui.invoiceModalOpen = true;
        ui.mobileMenuOpen = false;
        render();
      };
      ['sidebar-new-invoice', 'topbar-new-invoice'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('click', openNewInvoice);
      });

      // Dashboard & Invoices Table Actions
      const dashGoInv = document.getElementById('dash-go-invoices');
      if (dashGoInv) {
        dashGoInv.addEventListener('click', () => {
          ui.activeTab = 'invoices';
          render();
        });
      }

      const invSearch = document.getElementById('invoice-search-input');
      if (invSearch) {
        invSearch.addEventListener('input', (e) => {
          ui.invoiceSearch = e.target.value;
          render();
        });
      }

      document.querySelectorAll('.inv-filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.invoiceStatusFilter = btn.getAttribute('data-inv-filter');
          render();
        });
      });

      document.querySelectorAll('.preview-inv-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.previewInvoiceId = btn.getAttribute('data-preview-inv');
          render();
        });
      });

      document.querySelectorAll('.edit-inv-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-inv');
          const found = (appState.invoices || []).find((i) => i.id === id);
          if (!found) return;
          ui.editingInvoiceId = id;
          ui.draftInvoice = JSON.parse(JSON.stringify(found));
          ui.invoiceModalOpen = true;
          render();
        });
      });

      document.querySelectorAll('.del-inv-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-inv');
          const target = (appState.invoices || []).find((i) => i.id === id);
          appState.invoices = (appState.invoices || []).filter((i) => i.id !== id);
          commitState('DELETED_INVOICE', `Deleted invoice ${target?.invoiceNumber || id}.`);
          showToast('Invoice deleted.');
          render();
        });
      });

      document.querySelectorAll('.cycle-status-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-cycle-status');
          const order = ['Pending', 'Partial', 'Paid', 'Overdue'];
          appState.invoices = (appState.invoices || []).map((inv) => {
            if (inv.id !== id) return inv;
            const next = order[(order.indexOf(inv.status) + 1) % order.length];
            commitState('CHANGED_INVOICE_STATUS', `${inv.invoiceNumber} -> ${next}`);
            return { ...inv, status: next };
          });
          showToast('Updated invoice status.');
          render();
        });
      });

      document.querySelectorAll('.wa-inv-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-wa-inv');
          const inv = (appState.invoices || []).find((i) => i.id === id);
          if (!inv) return;
          window.open(buildWhatsAppShareUrl(inv), '_blank', 'noopener,noreferrer');
          commitState('SHARED_WHATSAPP', `Opened WhatsApp share for ${inv.invoiceNumber}.`);
          showToast('Opened WhatsApp summary.');
        });
      });

      // Invoice Editor Form Events
      const invForm = document.getElementById('invoice-editor-form');
      if (invForm) {
        const picker = document.getElementById('inv-customer-picker');
        if (picker) {
          picker.addEventListener('change', (e) => {
            syncDraftFromDOM();
            const cust = (appState.customers || []).find((c) => c.id === e.target.value);
            if (!cust) return;
            ui.draftInvoice.customerName = cust.contactName;
            ui.draftInvoice.customerCompany = cust.companyName;
            ui.draftInvoice.customerPhone = cust.whatsapp;
            ui.draftInvoice.customerEmail = cust.email;
            ui.draftInvoice.customerGstin = cust.gstin;
            ui.draftInvoice.customerAddress = cust.address;
            ui.draftInvoice.taxMode = cust.taxMode || 'INTRA';
            render();
          });
        }

        const addItemBtn = document.getElementById('add-line-item-btn');
        if (addItemBtn) {
          addItemBtn.addEventListener('click', () => {
            syncDraftFromDOM();
            const customFields = {};
            (appState.customColumns?.invoiceItems || []).forEach((c) => {
              customFields[c.id] = '';
            });
            ui.draftInvoice.items.push({
              description: '',
              hsn: '999293',
              qty: 1,
              rate: 0,
              discount: 0,
              customFields
            });
            render();
          });
        }

        document.querySelectorAll('.remove-item-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            syncDraftFromDOM();
            const idx = Number(btn.getAttribute('data-remove-item'));
            if (ui.draftInvoice.items.length > 1) {
              ui.draftInvoice.items.splice(idx, 1);
              render();
            }
          });
        });

        ['inv-tax-mode', 'inv-gst-rate', 'inv-status'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) {
            el.addEventListener('change', () => {
              syncDraftFromDOM();
              render();
            });
          }
        });

        document.querySelectorAll('.item-input').forEach((inp) => {
          inp.addEventListener('input', () => {
            syncDraftFromDOM();
          });
        });

        const hsnToggle = document.getElementById('toggle-hsn-col');
        if (hsnToggle) {
          hsnToggle.addEventListener('change', (e) => {
            syncDraftFromDOM();
            appState.showHsnCol = e.target.checked;
            commitState('TOGGLED_HSN_COL', `Set HSN/SAC visibility to ${e.target.checked}.`);
            render();
          });
        }

        const discToggle = document.getElementById('toggle-disc-col');
        if (discToggle) {
          discToggle.addEventListener('change', (e) => {
            syncDraftFromDOM();
            appState.showDiscountCol = e.target.checked;
            commitState('TOGGLED_DISC_COL', `Set Discount % visibility to ${e.target.checked}.`);
            render();
          });
        }

        const inlineAddCol = document.getElementById('inline-add-custom-col-btn');
        if (inlineAddCol) {
          inlineAddCol.addEventListener('click', () => {
            syncDraftFromDOM();
            const count = (appState.customColumns.invoiceItems?.length || 0) + 1;
            const newCol = {
              id: 'col-inv-' + Date.now(),
              label: `Custom Column ${count}`,
              type: 'text',
              showInPrint: true
            };
            appState.customColumns.invoiceItems.push(newCol);
            commitState('ADDED_INVOICE_COLUMN', `Added "${newCol.label}".`);
            showToast(`Added "${newCol.label}"`);
            render();
          });
        }

        invForm.addEventListener('submit', (e) => {
          e.preventDefault();
          syncDraftFromDOM();
          const payload = { ...ui.draftInvoice, createdBy: session.name };
          if (ui.editingInvoiceId) {
            payload.id = ui.editingInvoiceId;
            appState.invoices = (appState.invoices || []).map((i) =>
              i.id === ui.editingInvoiceId ? payload : i
            );
            commitState('UPDATED_INVOICE', `Updated invoice ${payload.invoiceNumber}.`);
            showToast(`Updated ${payload.invoiceNumber}`);
          } else {
            payload.id = 'inv-' + Date.now();
            appState.invoices = [payload, ...(appState.invoices || [])];
            commitState('CREATED_INVOICE', `Created invoice ${payload.invoiceNumber}.`);
            showToast(`Saved ${payload.invoiceNumber}`);
          }
          ui.invoiceModalOpen = false;
          ui.editingInvoiceId = null;
          ui.draftInvoice = null;
          render();
        });
      }

      // Preview Modal Buttons
      const modalPrint = document.getElementById('modal-print-pdf');
      if (modalPrint) {
        modalPrint.addEventListener('click', () => {
          window.print();
        });
      }
      const modalWa = document.getElementById('modal-wa-share');
      if (modalWa) {
        modalWa.addEventListener('click', () => {
          const inv = (appState.invoices || []).find((i) => i.id === ui.previewInvoiceId);
          if (inv) {
            window.open(buildWhatsAppShareUrl(inv), '_blank', 'noopener,noreferrer');
          }
        });
      }

      // Logo Editor Modal Events
      const logoForm = document.getElementById('logo-editor-form');
      if (logoForm) {
        document.querySelectorAll('.logo-mode-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            appState.branding.mode = btn.getAttribute('data-logo-mode');
            render();
          });
        });

        const fileInp = document.getElementById('logo-file-upload');
        if (fileInp) {
          fileInp.addEventListener('change', (e) => {
            const f = e.target.files?.[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              appState.branding.customImageUrl = String(reader.result || '');
              appState.branding.mode = 'image';
              render();
            };
            reader.readAsDataURL(f);
          });
        }

        const rangeInp = document.getElementById('logo-scale-range');
        if (rangeInp) {
          rangeInp.addEventListener('input', (e) => {
            appState.branding.scale = Number(e.target.value) || 100;
            const lbl = document.getElementById('logo-scale-val');
            if (lbl) lbl.textContent = `${appState.branding.scale}%`;
          });
        }

        const resetLogoBtn = document.getElementById('reset-default-logo-btn');
        if (resetLogoBtn) {
          resetLogoBtn.addEventListener('click', () => {
            appState.branding = { ...getSeedState().branding };
            commitState('RESET_LOGO', 'Reset logo to exact default Aurenza Academy wordmark.');
            showToast('Reset to default Aurenza logo.');
            render();
          });
        }

        logoForm.addEventListener('submit', (e) => {
          e.preventDefault();
          appState.branding = {
            ...appState.branding,
            primaryColor: document.getElementById('logo-primary-color')?.value || appState.branding.primaryColor,
            accentColor: document.getElementById('logo-accent-color')?.value || appState.branding.accentColor,
            subtitleColor: document.getElementById('logo-sub-color')?.value || appState.branding.subtitleColor,
            logoBgColor: document.getElementById('logo-bg-color')?.value || appState.branding.logoBgColor,
            scale: Number(document.getElementById('logo-scale-range')?.value) || 100,
            showSubtitle: document.getElementById('logo-show-sub')?.checked !== false,
            showFlankingLines: document.getElementById('logo-show-lines')?.checked !== false,
            ...(document.getElementById('logo-image-url')
              ? { customImageUrl: document.getElementById('logo-image-url').value.trim() }
              : {}),
            ...(document.getElementById('logo-text-title')
              ? { customTextTitle: document.getElementById('logo-text-title').value.trim() || 'AURENZA' }
              : {}),
            ...(document.getElementById('logo-sub-left')
              ? { customSubtitlePrefix: document.getElementById('logo-sub-left').value.trim() || 'ACADEMY' }
              : {}),
            ...(document.getElementById('logo-sub-right')
              ? { customSubtitleSuffix: document.getElementById('logo-sub-right').value.trim() || 'PRIVATE LIMITED' }
              : {})
          };
          ui.logoEditorModalOpen = false;
          commitState('UPDATED_BRANDING', `Updated logo (${appState.branding.mode}) and colors.`);
          showToast('Saved logo & brand settings.');
          render();
        });
      }

      // Customers Tab & Modal
      const custSearch = document.getElementById('customer-search-input');
      if (custSearch) {
        custSearch.addEventListener('input', (e) => {
          ui.customerSearch = e.target.value;
          render();
        });
      }
      const openAddCust = document.getElementById('open-add-customer');
      if (openAddCust) {
        openAddCust.addEventListener('click', () => {
          ui.editingCustomerId = null;
          ui.customerModalOpen = true;
          render();
        });
      }
      document.querySelectorAll('.edit-cust-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.editingCustomerId = btn.getAttribute('data-edit-cust');
          ui.customerModalOpen = true;
          render();
        });
      });
      document.querySelectorAll('.del-cust-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-cust');
          const c = (appState.customers || []).find((x) => x.id === id);
          appState.customers = (appState.customers || []).filter((x) => x.id !== id);
          commitState('DELETED_CUSTOMER', `Deleted customer ${c?.companyName || id}.`);
          showToast('Customer deleted.');
          render();
        });
      });
      document.querySelectorAll('.bill-cust-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-bill-cust');
          const cust = (appState.customers || []).find((c) => c.id === id);
          if (!cust) return;
          const draft = createBlankDraftInvoice();
          draft.customerName = cust.contactName;
          draft.customerCompany = cust.companyName;
          draft.customerPhone = cust.whatsapp;
          draft.customerEmail = cust.email;
          draft.customerGstin = cust.gstin;
          draft.customerAddress = cust.address;
          draft.taxMode = cust.taxMode || 'INTRA';
          ui.editingInvoiceId = null;
          ui.draftInvoice = draft;
          ui.invoiceModalOpen = true;
          render();
        });
      });

      const custForm = document.getElementById('customer-form');
      if (custForm) {
        custForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(custForm);
          const customFields = {};
          (appState.customColumns?.customers || []).forEach((col) => {
            customFields[col.id] = String(fd.get('custom_' + col.id) || '').trim();
          });
          const rec = {
            id: ui.editingCustomerId || 'cust-' + Date.now(),
            contactName: String(fd.get('contactName') || '').trim(),
            companyName: String(fd.get('companyName') || '').trim(),
            whatsapp: String(fd.get('whatsapp') || '').trim(),
            email: String(fd.get('email') || '').trim(),
            gstin: String(fd.get('gstin') || '').trim(),
            taxMode: fd.get('taxMode') || 'INTRA',
            address: String(fd.get('address') || '').trim(),
            customFields
          };
          if (ui.editingCustomerId) {
            appState.customers = (appState.customers || []).map((c) =>
              c.id === ui.editingCustomerId ? rec : c
            );
            commitState('UPDATED_CUSTOMER', `Updated customer ${rec.companyName}.`);
          } else {
            appState.customers = [rec, ...(appState.customers || [])];
            commitState('ADDED_CUSTOMER', `Added customer ${rec.companyName}.`);
          }
          ui.customerModalOpen = false;
          ui.editingCustomerId = null;
          showToast('Customer saved.');
          render();
        });
      }

      // Vendors Tab & Modal
      const vendSearch = document.getElementById('vendor-search-input');
      if (vendSearch) {
        vendSearch.addEventListener('input', (e) => {
          ui.vendorSearch = e.target.value;
          render();
        });
      }
      const openAddVend = document.getElementById('open-add-vendor');
      if (openAddVend) {
        openAddVend.addEventListener('click', () => {
          ui.editingVendorId = null;
          ui.vendorModalOpen = true;
          render();
        });
      }
      document.querySelectorAll('.edit-vend-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.editingVendorId = btn.getAttribute('data-edit-vend');
          ui.vendorModalOpen = true;
          render();
        });
      });
      document.querySelectorAll('.del-vend-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-vend');
          const v = (appState.vendors || []).find((x) => x.id === id);
          appState.vendors = (appState.vendors || []).filter((x) => x.id !== id);
          commitState('DELETED_VENDOR', `Deleted vendor ${v?.companyName || id}.`);
          showToast('Vendor deleted.');
          render();
        });
      });

      const vendForm = document.getElementById('vendor-form');
      if (vendForm) {
        vendForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(vendForm);
          const customFields = {};
          (appState.customColumns?.vendors || []).forEach((col) => {
            customFields[col.id] = String(fd.get('custom_' + col.id) || '').trim();
          });
          const rec = {
            id: ui.editingVendorId || 'vend-' + Date.now(),
            companyName: String(fd.get('companyName') || '').trim(),
            contactName: String(fd.get('contactName') || '').trim(),
            category: String(fd.get('category') || '').trim(),
            phone: String(fd.get('phone') || '').trim(),
            email: String(fd.get('email') || '').trim(),
            gstin: String(fd.get('gstin') || '').trim(),
            address: String(fd.get('address') || '').trim(),
            customFields
          };
          if (ui.editingVendorId) {
            appState.vendors = (appState.vendors || []).map((v) =>
              v.id === ui.editingVendorId ? rec : v
            );
            commitState('UPDATED_VENDOR', `Updated vendor ${rec.companyName}.`);
          } else {
            appState.vendors = [rec, ...(appState.vendors || [])];
            commitState('ADDED_VENDOR', `Added vendor ${rec.companyName}.`);
          }
          ui.vendorModalOpen = false;
          ui.editingVendorId = null;
          showToast('Vendor saved.');
          render();
        });
      }

      // Expenses Tab & Modal
      const openAddExp = document.getElementById('open-add-expense');
      if (openAddExp) {
        openAddExp.addEventListener('click', () => {
          ui.editingExpenseId = null;
          ui.expenseModalOpen = true;
          render();
        });
      }
      document.querySelectorAll('.edit-exp-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.editingExpenseId = btn.getAttribute('data-edit-exp');
          ui.expenseModalOpen = true;
          render();
        });
      });
      document.querySelectorAll('.del-exp-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-exp');
          const ex = (appState.expenses || []).find((x) => x.id === id);
          appState.expenses = (appState.expenses || []).filter((x) => x.id !== id);
          commitState('DELETED_EXPENSE', `Deleted expense ${ex?.vendor || id}.`);
          showToast('Expense deleted.');
          render();
        });
      });

      const expForm = document.getElementById('expense-form');
      if (expForm) {
        expForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(expForm);
          const rec = {
            id: ui.editingExpenseId || 'exp-' + Date.now(),
            vendor: String(fd.get('vendor') || '').trim(),
            category: String(fd.get('category') || '').trim(),
            date: String(fd.get('date') || '').trim(),
            amount: Number(fd.get('amount')) || 0,
            gstInput: Number(fd.get('gstInput')) || 0,
            status: fd.get('status') || 'Paid',
            notes: String(fd.get('notes') || '').trim()
          };
          if (ui.editingExpenseId) {
            appState.expenses = (appState.expenses || []).map((ex) =>
              ex.id === ui.editingExpenseId ? rec : ex
            );
            commitState('UPDATED_EXPENSE', `Updated expense ${rec.vendor} (${formatINR(rec.amount)}).`);
          } else {
            appState.expenses = [rec, ...(appState.expenses || [])];
            commitState('ADDED_EXPENSE', `Recorded expense ${rec.vendor} (${formatINR(rec.amount)}).`);
          }
          ui.expenseModalOpen = false;
          ui.editingExpenseId = null;
          showToast('Expense saved.');
          render();
        });
      }

      // Vercel Tab Copy Button
      const copyVercelBtn = document.getElementById('copy-vercel-json-btn');
      if (copyVercelBtn) {
        copyVercelBtn.addEventListener('click', () => {
          const text = getVercelJsonSnippet();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(() => {});
          }
          showToast('Copied vercel.json configuration.');
        });
      }

      // Settings Form & Custom Column Add/Edit/Delete
      const settingsForm = document.getElementById('company-settings-form');
      if (settingsForm) {
        settingsForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(settingsForm);
          appState.company = {
            ...appState.company,
            name: String(fd.get('name') || '').trim(),
            gstin: String(fd.get('gstin') || '').trim(),
            cin: String(fd.get('cin') || '').trim(),
            invoicePrefix: String(fd.get('invoicePrefix') || 'AUR-2026-').trim(),
            email: String(fd.get('email') || '').trim(),
            phone: String(fd.get('phone') || '').trim(),
            address: String(fd.get('address') || '').trim(),
            bankName: String(fd.get('bankName') || '').trim(),
            accountNo: String(fd.get('accountNo') || '').trim(),
            ifsc: String(fd.get('ifsc') || '').trim(),
            upiId: String(fd.get('upiId') || '').trim(),
            vercelProjectName: String(fd.get('vercelProjectName') || '').trim(),
            adminCodeHint: String(fd.get('adminCodeHint') || 'ADMIN2026').trim(),
            employeeCodeHint: String(fd.get('employeeCodeHint') || 'STAFF2026').trim(),
            syncWebhookUrl: String(fd.get('syncWebhookUrl') || '').trim()
          };
          commitState('UPDATED_SETTINGS', 'Updated company settings, PINs, and Vercel config.');
          showToast('Settings saved.');
          render();
        });
      }

      document.querySelectorAll('.add-custom-col-form').forEach((f) => {
        f.addEventListener('submit', (e) => {
          e.preventDefault();
          const scope = f.getAttribute('data-add-col-scope');
          const txtInp = f.querySelector('input[type="text"]');
          const selInp = f.querySelector('select');
          const label = String(txtInp?.value || '').trim();
          const type = selInp?.value || 'text';
          if (!label || !appState.customColumns[scope]) return;
          appState.customColumns[scope].push({
            id: `${scope}-col-${Date.now()}`,
            label,
            type,
            showInPrint: true
          });
          commitState('ADDED_CUSTOM_COLUMN', `Added column "${label}" to ${scope}.`);
          showToast(`Added "${label}"`);
          render();
        });
      });

      document.querySelectorAll('.start-edit-col-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          ui.editingColScope = btn.getAttribute('data-start-edit-col-scope');
          ui.editingColId = btn.getAttribute('data-start-edit-col-id');
          render();
        });
      });

      const cancelEditCol = document.getElementById('cancel-edit-col-btn');
      if (cancelEditCol) {
        cancelEditCol.addEventListener('click', () => {
          ui.editingColScope = null;
          ui.editingColId = null;
          render();
        });
      }

      document.querySelectorAll('.edit-custom-col-form').forEach((f) => {
        f.addEventListener('submit', (e) => {
          e.preventDefault();
          const scope = f.getAttribute('data-edit-col-scope');
          const colId = f.getAttribute('data-edit-col-id');
          const newLabel = String(f.querySelector('input[type="text"]')?.value || '').trim();
          const newType = f.querySelector('select')?.value || 'text';
          if (!newLabel || !appState.customColumns[scope]) return;
          appState.customColumns[scope] = appState.customColumns[scope].map((c) =>
            c.id === colId ? { ...c, label: newLabel, type: newType } : c
          );
          ui.editingColScope = null;
          ui.editingColId = null;
          commitState('EDITED_CUSTOM_COLUMN', `Renamed column ${colId} to "${newLabel}".`);
          showToast('Custom column updated.');
          render();
        });
      });

      document.querySelectorAll('.del-custom-col-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const scope = btn.getAttribute('data-del-col-scope');
          const colId = btn.getAttribute('data-del-col-id');
          if (!appState.customColumns[scope]) return;
          appState.customColumns[scope] = appState.customColumns[scope].filter((c) => c.id !== colId);
          commitState('DELETED_CUSTOM_COLUMN', `Deleted column ${colId} from ${scope}.`);
          showToast('Custom column deleted.');
          render();
        });
      });

      // Audit & Backups Events
      const auditSearch = document.getElementById('audit-search-input');
      if (auditSearch) {
        auditSearch.addEventListener('input', (e) => {
          ui.auditSearch = e.target.value;
          render();
        });
      }
      const auditExportJson = document.getElementById('audit-export-json');
      if (auditExportJson) auditExportJson.addEventListener('click', exportJsonFn);

      const auditExportCsv = document.getElementById('audit-export-csv');
      if (auditExportCsv) {
        auditExportCsv.addEventListener('click', () => {
          const rows = [['InvoiceNumber', 'Date', 'DueDate', 'Customer', 'Company', 'GSTIN', 'TaxMode', 'GSTRate', 'GrandTotal', 'Status']];
          (appState.invoices || []).forEach((inv) => {
            const t = computeInvoiceTotals(inv.items, inv.taxMode, inv.gstRate);
            rows.push([
              inv.invoiceNumber,
              inv.date,
              inv.dueDate,
              inv.customerName,
              inv.customerCompany,
              inv.customerGstin,
              inv.taxMode,
              inv.gstRate,
              t.grandTotal.toFixed(2),
              inv.status
            ]);
          });
          const csv = rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
          downloadFile(`aurenza-invoices-${new Date().toISOString().split('T')[0]}.csv`, csv, 'text/csv;charset=utf-8;');
          showToast('Exported invoices CSV.');
        });
      }

      const auditImportJson = document.getElementById('audit-import-json');
      if (auditImportJson) {
        auditImportJson.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(String(reader.result || '{}'));
              appState = { ...getSeedState(), ...parsed };
              commitState('IMPORTED_JSON', `Restored workspace from ${file.name}.`);
              showToast('Workspace restored from JSON.');
              render();
            } catch (err) {
              showToast('Invalid JSON backup file.', 'error');
            }
          };
          reader.readAsText(file);
        });
      }

      const auditResetDemo = document.getElementById('audit-reset-demo');
      if (auditResetDemo) {
        auditResetDemo.addEventListener('click', () => {
          appState = getSeedState();
          commitState('RESET_DEMO_DATA', 'Restored default Aurenza demo dataset.');
          showToast('Restored demo dataset.');
          render();
        });
      }
    }

    // Boot application
    render();
  </script>
</body>
</html>
